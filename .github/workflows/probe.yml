name: probe
on:
  workflow_dispatch:
  push:
    branches: [ probe ]

jobs:
  probe26:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: 切到 Xcode 26.3 并验证 Liquid Glass SDK
        shell: bash
        run: |
          set -x
          ls -d /Applications/Xcode_26*.app
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          echo "--- UIGlassEffect.h ---"
          ls -l "$SDK/System/Library/Frameworks/UIKit.framework/Headers/UIGlassEffect.h" || echo "MISSING UIGlassEffect.h"
          echo "--- 关键符号 ---"
          grep -n -E "UIGlassEffect|UIGlassContainerEffect|@interface|@property" "$SDK/System/Library/Frameworks/UIKit.framework/Headers/UIGlassEffect.h" 2>/dev/null | head -30 || true
          echo "--- SwiftUI glassEffect ---"
          SI="$SDK/System/Library/Frameworks/SwiftUI.framework/Modules/SwiftUI.swiftmodule/arm64-apple-ios.swiftinterface"
          if [ -f "$SI" ]; then grep -c "glassEffect" "$SI" || true; else echo "no swiftinterface"; fi
          echo "--- 编译最小 Liquid Glass 片段 ---"
          printf '%s\n' \
            '#import <UIKit/UIKit.h>' \
            '@interface T : NSObject @end' \
            '@implementation T' \
            '+ (void)run {' \
            '  if (@available(iOS 26.0, *)) {' \
            '    UIGlassEffect *e = [UIGlassEffect effect];' \
            '    e.interactive = YES;' \
            '    UIView *v = [[UIView alloc] init];' \
            '    UIVisualEffectView *bv = [[UIVisualEffectView alloc] initWithEffect:e];' \
            '    [v addSubview:bv];' \
            '  }' \
            '}' \
            '@end' > /tmp/gt.m
          xcrun -sdk iphoneos clang -target arm64-apple-ios26.0 -fobjc-arc -c /tmp/gt.m -o /tmp/gt.o && echo "COMPILE_OK" || echo "COMPILE_FAIL"
