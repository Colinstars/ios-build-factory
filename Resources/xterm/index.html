<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Terminal</title>
  <link rel="stylesheet" href="xterm.css" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #1a1b26;
      overflow: hidden;
    }
    #terminal-container {
      width: 100%;
      height: 100%;
      padding: 8px 6px 42px 6px;
    }
    .xterm {
      height: 100%;
    }
    .xterm-viewport {
      background-color: transparent !important;
    }
  </style>
</head>
<body>
  <div id="terminal-container"></div>

  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>

  <script>
    // 工业级 Tokyo Night / One Dark 经典配色与专业渲染设置 (对标 Blink & WebSSH)
    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'block',
      fontSize: 13,
      fontFamily: '"SF Mono", Menlo, Monaco, Consolas, "Courier New", monospace',
      lineHeight: 1.25,
      theme: {
        background: '#1a1b26',
        foreground: '#c0caf5',
        cursor: '#7aa2f7',
        cursorAccent: '#1a1b26',
        selectionBackground: 'rgba(122, 162, 247, 0.3)',
        black: '#15161e',
        red: '#f7768e',
        green: '#9ece6a',
        yellow: '#e0af68',
        blue: '#7aa2f7',
        magenta: '#bb9af7',
        cyan: '#7dcfff',
        white: '#a9b1d6',
        brightBlack: '#414868',
        brightRed: '#f7768e',
        brightGreen: '#9ece6a',
        brightYellow: '#e0af68',
        brightBlue: '#7aa2f7',
        brightMagenta: '#bb9af7',
        brightCyan: '#7dcfff',
        brightWhite: '#c0caf5'
      },
      convertEol: true,
      allowProposedApi: true
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);

    const container = document.getElementById('terminal-container');
    term.open(container);
    fitAddon.fit();

    window.addEventListener('resize', () => {
      fitAddon.fit();
      reportSize();
    });

    function reportSize() {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.terminalResize) {
        window.webkit.messageHandlers.terminalResize.postMessage({
          cols: term.cols,
          rows: term.rows
        });
      }
    }

    // 聚焦输入
    window.addEventListener('click', () => {
      term.focus();
    });

    // 原生向 JS 注入终端输出流
    window.writeBase64 = function(b64) {
      try {
        const text = decodeURIComponent(escape(atob(b64)));
        term.write(text);
      } catch (e) {
        term.write(atob(b64));
      }
    };

    // 用户在终端输入时向原生上报
    term.onData(data => {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.terminalInput) {
        window.webkit.messageHandlers.terminalInput.postMessage({ data: data });
      }
    });

    // 清屏
    window.clearTerminal = function() {
      term.clear();
    };

    window.fitTerminal = function() {
      fitAddon.fit();
      reportSize();
    };

    // 初始聚焦与自适应
    setTimeout(() => {
      fitAddon.fit();
      term.focus();
      reportSize();
    }, 100);
  </script>
</body>
</html>
