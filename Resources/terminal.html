<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            overflow: hidden;
        }
        #terminal-container {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 8px;
        }
        /* 简单全能 ANSI 终端模拟层 */
        #term {
            width: 100%;
            height: 100%;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.35;
            color: #c9d1d9;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #58a6ff;
            vertical-align: text-bottom;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="terminal-container">
        <div id="term"><span id="output"></span><span class="cursor"></span></div>
    </div>

    <script>
        const output = document.getElementById('output');
        const term = document.getElementById('term');

        // 原生注入数据通道
        window.writeToTerminal = function(base64Data) {
            try {
                const text = decodeURIComponent(escape(atob(base64Data)));
                output.textContent += text;
                term.scrollTop = term.scrollHeight;
            } catch (e) {
                // 回退直接文本
                output.textContent += atob(base64Data);
                term.scrollTop = term.scrollHeight;
            }
        };

        window.clearTerminal = function() {
            output.textContent = '';
        };

        // 监听物理/软键盘事件向原生回传
        window.addEventListener('keydown', function(e) {
            let key = e.key;
            if (key === 'Enter') key = '\r';
            else if (key === 'Backspace') key = '\x7f';
            else if (key === 'Tab') { key = '\t'; e.preventDefault(); }
            else if (key === 'Escape') key = '\x1b';
            
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.terminalInput) {
                window.webkit.messageHandlers.terminalInput.postMessage({ key: key });
            }
        });
    </script>
</body>
</html>
